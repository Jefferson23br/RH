<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processo Seletivo - Avaliação</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f9; color: #333; padding: 20px; }
        .container { max-width: 750px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .intro { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .user-info { display: flex; gap: 20px; margin-bottom: 30px; padding: 20px; background: #f9f9f9; border-radius: 8px; }
        .user-info div { flex: 1; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .question { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .question p { font-weight: bold; margin-bottom: 12px; color: #34495e; }
        label { display: block; margin-bottom: 10px; cursor: pointer; font-size: 15px; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        button { width: 100%; padding: 18px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #219150; }
        #success-msg { display: none; text-align: center; padding: 50px; }
        .loading { display: none; text-align: center; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <h1>Avaliação de Perfil Comportamental</h1>
    <p class="intro">Responda a todas as questões pensando em sua atuação profissional predominante.</p>

    <form id="behavioralForm" action="https://formspree.io/f/xkoplenw" method="POST">
        
        <div class="user-info">
            <div>
                <label>Nome Completo:</label>
                <input type="text" name="Nome_Candidato" required placeholder="Digite seu nome">
            </div>
            <div>
                <label>E-mail:</label>
                <input type="email" name="_replyto" required placeholder="seu@email.com">
            </div>
        </div>

        <div id="questions"></div>

        <input type="hidden" name="PERFIL_CALCULADO" id="res_perfil">
        <input type="hidden" name="PONTOS_DOMINANTE_A" id="res_a">
        <input type="hidden" name="PONTOS_INFLUENTE_B" id="res_b">
        <input type="hidden" name="PONTOS_ESTAVEL_C" id="res_c">
        <input type="hidden" name="PONTOS_CONFORME_D" id="res_d">
        <input type="hidden" name="_next" value="javascript:void(0)">

        <div class="loading" id="loading-text">Enviando respostas... aguarde.</div>
        <button type="submit" id="btn-submit">Finalizar e Enviar Teste</button>
    </form>
</div>

<div class="container" id="success-msg">
    <h2 style="color: #27ae60;">Teste Concluído!</h2>
    <p>Suas respostas foram enviadas com sucesso para o departamento responsável.</p>
    <p>Agradecemos sua participação.</p>
</div>

<script>
    const data = [
        { q: "Em situações de conflito, você:", a: "Enfrenta diretamente para resolver.", b: "Tenta apaziguar com bom humor.", c: "Ouve e busca um consenso.", d: "Analisa os fatos friamente." },
        { q: "Sua maior motivação é:", a: "Poder e autonomia.", b: "Reconhecimento e prestígio.", c: "Segurança e estabilidade.", d: "Conhecimento e perfeição." },
        { q: "Ao realizar uma tarefa, você prioriza:", a: "A velocidade e o resultado.", b: "A criatividade e o entusiasmo.", c: "A harmonia da equipe.", d: "A precisão e os detalhes." },
        { q: "Como você prefere ser liderado?", a: "Com liberdade e desafios.", b: "Com incentivos e elogios.", c: "Com clareza e apoio.", d: "Com normas e instruções técnicas." },
        { q: "Sua principal característica é:", a: "Determinação.", b: "Comunicatividade.", c: "Paciência.", d: "Organização." },
        { q: "Em novos projetos, você sente:", a: "Vontade de assumir o controle.", b: "Empolgação para interagir.", c: "Necessidade de planejar o ritmo.", d: "Necessidade de investigar os riscos." },
        { q: "O que te gera mais estresse?", a: "Sentir que está perdendo tempo.", b: "Ser ignorado ou excluído.", c: "Ambientes caóticos e brigas.", d: "Trabalhar sem dados ou lógica." },
        { q: "Seu estilo de comunicação é:", a: "Direto e objetivo.", b: "Persuasivo e alegre.", c: "Calmo e acolhedor.", d: "Formal e contido." },
        { q: "Como você lida com erros?", a: "Corrige rápido e segue em frente.", b: "Tenta minimizar com otimismo.", c: "Sente-se culpado e busca aprender.", d: "Analisa a causa raiz do erro." },
        { q: "No tempo livre, você prefere:", a: "Atividades competitivas.", b: "Estar com muitos amigos.", c: "Descansar em paz e silêncio.", d: "Hobbies que exijam concentração." },
        // Complementando as 20 perguntas solicitadas
        { q: "Ao planejar algo, você:", a: "Define a meta e vai executando.", b: "Imagina o sucesso e as pessoas envolvidas.", c: "Pensa em como manter o equilíbrio.", d: "Escreve cada passo e regra." },
        { q: "As pessoas dizem que você é:", a: "Exigente e focado.", b: "Divertido e falante.", c: "Confiável e tranquilo.", d: "Analítico e detalhista." },
        { q: "Em um grupo, você busca:", a: "Eficiência.", b: "Popularidade.", c: "Lealdade.", d: "Exatidão." },
        { q: "Sua reação à pressão é:", a: "Tornar-se mais agressivo/rápido.", b: "Tornar-se mais agitado/emotivo.", c: "Tornar-se mais lento/resistente.", d: "Tornar-se mais crítico/retraído." },
        { q: "Você se sente melhor quando:", a: "Vence uma disputa.", b: "É o centro das atenções.", c: "Ajuda alguém sinceramente.", d: "Resolve um problema complexo." },
        { q: "Sua organização pessoal é:", a: "Focada apenas no essencial.", b: "Um pouco desordenada.", c: "Previsível e constante.", d: "Meticulosa e lógica." },
        { q: "O que você mais valoriza no trabalho?", a: "Independência.", b: "Networking.", c: "Ambiente amigável.", d: "Processos bem definidos." },
        { q: "Seus argumentos são baseados em:", a: "Convicção e força.", b: "Entusiasmo e sonhos.", c: "Bem-estar e tradição.", d: "Evidências e provas." },
        { q: "Diante de uma ordem injusta, você:", a: "Questiona e desafia abertamente.", b: "Tenta negociar de forma amigável.", c: "Aceita, mas fica chateado.", d: "Aponta os erros técnicos da ordem." },
        { q: "Seu foco de vida hoje é:", a: "Conquista.", b: "Conexão.", c: "Serenidade.", d: "Competência." }
    ];

    const qContainer = document.getElementById('questions');
    data.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'question';
        div.innerHTML = `
            <p>${i+1}. ${item.q}</p>
            <label><input type="radio" name="Q${i+1}" value="A" required> ${item.a}</label>
            <label><input type="radio" name="Q${i+1}" value="B"> ${item.b}</label>
            <label><input type="radio" name="Q${i+1}" value="C"> ${item.c}</label>
            <label><input type="radio" name="Q${i+1}" value="D"> ${item.d}</label>
        `;
        qContainer.appendChild(div);
    });

    document.getElementById('behavioralForm').onsubmit = function() {
        const formData = new FormData(this);
        let c = { A: 0, B: 0, C: 0, D: 0 };
        for(let v of formData.values()) { if(c[v] !== undefined) c[v]++; }

        const max = Object.keys(c).reduce((a, b) => c[a] > c[b] ? a : b);
        const nomes = { A: "DOMINANTE", B: "INFLUENTE", C: "ESTÁVEL", D: "CONFORME" };

        document.getElementById('res_perfil').value = nomes[max];
        document.getElementById('res_a').value = c.A;
        document.getElementById('res_b').value = c.B;
        document.getElementById('res_c').value = c.C;
        document.getElementById('res_d').value = c.D;

        document.getElementById('btn-submit').style.display = 'none';
        document.getElementById('loading-text').style.display = 'block';

        // O envio acontece via Formspree. Após o envio, escondemos o form.
        setTimeout(() => {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            window.scrollTo(0,0);
        }, 1500);
    };
</script>

</body>
</html>
